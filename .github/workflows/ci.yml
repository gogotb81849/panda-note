# ============================================================
# CI 工作流 - 熊猫笔记
# 触发：push 到 main/dev 分支，或 PR 到 main
# ============================================================

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------
  # Job 1: Backend CI
  # --------------------------------------------------------
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 安装后端依赖
        run: npm ci

      - name: ESLint 检查
        run: npm run lint

      - name: 运行单元测试
        run: npm test

      - name: 构建后端
        run: npm run build

  # --------------------------------------------------------
  # Job 2: Frontend CI
  # --------------------------------------------------------
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build
