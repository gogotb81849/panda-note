name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment env"
        required: true
        default: "production"
        type: choice
        options:
          - production

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install canvas deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev pkg-config

      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build backend
        working-directory: backend
        run: |
          set +e
          npm run build
          BUILD_EXIT=$?
          set -e
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::warning::tsc reported type errors (exit=$BUILD_EXIT), but JS files were emitted"
            if [ ! -f dist/main.js ]; then
              echo "::error::dist/main.js not found after build"
              exit 1
            fi
          fi
          echo "Backend build OK"

      - name: Run backend tests
        working-directory: backend
        run: |
          npx prisma@5 generate --schema=prisma/schema.prisma
          node node_modules/.bin/jest --ci --reporters=default 2>&1
          echo "Backend tests passed"

      - name: Install frontend deps
        working-directory: frontend
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package artifacts
        run: |
          rm -rf dist-artifacts
          mkdir -p dist-artifacts/backend-dist
          mkdir -p dist-artifacts/prisma
          cp -r backend/dist/* dist-artifacts/backend-dist/
          cp backend/package.json dist-artifacts/backend-package.json
          if [ -f backend/package-lock.json ]; then cp backend/package-lock.json dist-artifacts/backend-package-lock.json; fi
          cp -r backend/prisma/* dist-artifacts/prisma/
          cp -r frontend/.output dist-artifacts/frontend-output
          tar czf dist-artifacts.tar.gz dist-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist-artifacts.tar.gz
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p ${{ secrets.SSH_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Upload package to server
        run: |
          scp -P ${{ secrets.SSH_PORT }} dist-artifacts.tar.gz \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/panda-note-dist.tar.gz
          echo "Upload OK"

      - name: Remote deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            TAR_FILE="/tmp/panda-note-dist.tar.gz"

            echo "=== Panda Note Deploy ==="
            echo "Time: $(date)"

            echo "[1/5] Prepare dirs..."
            mkdir -p "$DEPLOY_DIR/backend/dist" "$DEPLOY_DIR/backend/prisma" "$DEPLOY_DIR/frontend/.output"

            echo "[2/5] Extract build artifacts..."
            cd /tmp
            rm -rf dist-artifacts
            tar xzf "$TAR_FILE"
            rm -f "$TAR_FILE"

            rm -rf "$DEPLOY_DIR/backend/dist"/*
            cp -rf /tmp/dist-artifacts/backend-dist/* "$DEPLOY_DIR/backend/dist/"
            cp -f /tmp/dist-artifacts/backend-package.json "$DEPLOY_DIR/backend/package.json"
            if [ -f /tmp/dist-artifacts/backend-package-lock.json ]; then
              cp -f /tmp/dist-artifacts/backend-package-lock.json "$DEPLOY_DIR/backend/package-lock.json"
            fi
            rm -rf "$DEPLOY_DIR/backend/prisma"/*
            cp -rf /tmp/dist-artifacts/prisma/* "$DEPLOY_DIR/backend/prisma/"
            rm -rf "$DEPLOY_DIR/frontend/.output"/*
            cp -rf /tmp/dist-artifacts/frontend-output/* "$DEPLOY_DIR/frontend/.output/"
            rm -rf /tmp/dist-artifacts

            echo "[3/5] Install backend prod deps..."
            cd "$DEPLOY_DIR/backend"
            npm install --omit=dev --no-audit --no-fund --legacy-peer-deps

            echo "[3.5/5] Regenerate Prisma client..."
            npx prisma@5 generate --schema=prisma/schema.prisma

            echo "[4/5] Sync DB schema..."
            cd "$DEPLOY_DIR/backend"
            npx prisma@5 db push --schema=prisma/schema.prisma --accept-data-loss

            echo "[5/5] Restart PM2..."
            echo "[debug] DEPLOY_DIR=$DEPLOY_DIR"
            echo "[debug] backend/package.json version: $(cat $DEPLOY_DIR/backend/package.json | head -5)"
            echo "[debug] list PM2 processes BEFORE reload:"
            pm2 ls || true
            echo "[debug] nav-log-backend pm cwd:"
            pm2 show nav-log-backend 2>/dev/null | grep -E "exec cwd|status" || true
            echo "[debug] nav-log-frontend pm cwd:"
            pm2 show nav-log-frontend 2>/dev/null | grep -E "exec cwd|status" || true

            # —— 后端重启 ——
            # 先 delete 再 start：避免 PM2 沿用第一次保存时的旧 cwd
            cd "$DEPLOY_DIR/backend"
            pm2 delete nav-log-backend 2>/dev/null || true
            pm2 start dist/main.js \
              --name nav-log-backend \
              --cwd "$DEPLOY_DIR/backend" \
              --node-args="--max-old-space-size=512" || true

            # —— 前端重启 ——
            cd "$DEPLOY_DIR/frontend"
            ls -la .output/server/index.mjs || echo "WARNING: .output/server/index.mjs NOT FOUND"
            pm2 delete nav-log-frontend 2>/dev/null || true
            pm2 start .output/server/index.mjs \
              --name nav-log-frontend \
              --cwd "$DEPLOY_DIR/frontend" \
              --node-args="--max-old-space-size=512" || true

            pm2 ls || true
            pm2 save

            echo "=== Deploy script done! ==="

      - name: Health check
        run: |
          echo "Waiting 15s for services..."
          sleep 15
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 5 --max-time 10 \
            http://${{ secrets.DEPLOY_HOST }}:3002/api/ops/health || echo "000")
          echo "Backend health: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "SUCCESS!"
          else
            echo "Warning: backend returned $HTTP_CODE"
          fi
          echo ""
          echo "URL: http://${{ secrets.DEPLOY_HOST }}"
