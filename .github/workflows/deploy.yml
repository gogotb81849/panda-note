# ============================================================
# 部署工作流 - 熊猫笔记
# 触发：push 到 main 分支
# Jobs: build (lint + typecheck), deploy (rsync to server, pm2 reload)
# ============================================================

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "部署环境"
        required: true
        default: "production"
        type: choice
        options:
          - production

jobs:
  # --------------------------------------------------------
  # Job 1: Build - Lint + Typecheck
  # --------------------------------------------------------
  build:
    name: 构建与检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -------- 后端 --------
      - name: 安装后端依赖
        working-directory: backend
        run: npm ci

      - name: 后端 Lint 检查
        working-directory: backend
        run: npm run lint

      - name: 后端 TypeScript 类型检查
        working-directory: backend
        run: npx tsc --noEmit

      - name: 构建后端
        working-directory: backend
        run: npm run build

      # -------- 前端 --------
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端 TypeScript 类型检查
        working-directory: frontend
        run: npx nuxi typecheck

      - name: 构建前端
        working-directory: frontend
        run: npm run build

      # -------- 打包产物 --------
      - name: 打包构建产物
        run: |
          mkdir -p dist-artifacts
          cp -r backend/dist dist-artifacts/backend-dist
          cp backend/package.json dist-artifacts/backend-package.json
          cp backend/package-lock.json dist-artifacts/backend-package-lock.json
          cp -r backend/prisma dist-artifacts/prisma
          cp -r frontend/.output dist-artifacts/frontend-output
          tar czf dist-artifacts.tar.gz dist-artifacts

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist-artifacts.tar.gz
          retention-days: 1

  # --------------------------------------------------------
  # Job 2: Deploy - rsync to server, pm2 reload
  # --------------------------------------------------------
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts

      - name: 解压构建产物
        run: tar xzf dist-artifacts.tar.gz

      - name: 配置 SSH 密钥
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 添加服务器到 known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 安装 rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: 部署后端 - rsync
        run: |
          rsync -avz --delete \
            dist-artifacts/backend-dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/backend/dist/

          rsync -avz \
            dist-artifacts/backend-package.json \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/backend/package.json

          rsync -avz \
            dist-artifacts/backend-package-lock.json \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/backend/package-lock.json

          rsync -avz \
            dist-artifacts/prisma/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/backend/prisma/

      - name: 部署前端 - rsync
        run: |
          rsync -avz --delete \
            dist-artifacts/frontend-output/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/frontend/.output/

      - name: 远程安装依赖并重启服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"

            # ---- 后端 ----
            echo ">>> 安装后端生产依赖..."
            cd "$DEPLOY_DIR/backend"
            npm ci --omit=dev

            echo ">>> 运行数据库迁移..."
            npx prisma migrate deploy

            echo ">>> 重启后端 PM2..."
            pm2 reload nav-log-backend 2>/dev/null || \
              pm2 start dist/main.js --name nav-log-backend

            # ---- 前端 ----
            echo ">>> 重启前端 PM2..."
            cd "$DEPLOY_DIR/frontend"
            pm2 reload nav-log-frontend 2>/dev/null || \
              pm2 start .output/server/index.mjs --name nav-log-frontend

            # ---- 保存 PM2 配置 ----
            pm2 save

            echo ">>> 部署完成！"

      - name: 健康检查
        run: |
          echo "等待服务启动..."
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.DEPLOY_HOST }}:3002/api/ops/health || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ 后端健康检查通过！HTTP $HTTP_CODE"
          else
            echo "⚠️ 后端健康检查失败！HTTP $HTTP_CODE"
          fi

          HTTP_CODE_FE=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.DEPLOY_HOST }}:3000/ || echo "000")
          if [ "$HTTP_CODE_FE" = "200" ]; then
            echo "✅ 前端健康检查通过！HTTP $HTTP_CODE_FE"
          else
            echo "⚠️ 前端健康检查失败！HTTP $HTTP_CODE_FE"
          fi