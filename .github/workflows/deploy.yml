name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment env"
        required: true
        default: "production"
        type: choice
        options:
          - production

jobs:
  build:
    name: 构建前后端
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 canvas 系统依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev pkg-config

      - name: 安装后端依赖
        working-directory: backend
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: 构建后端 (NestJS -> dist)
        working-directory: backend
        run: |
          set +e
          npm run build
          BUILD_EXIT=$?
          set -e
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::warning::tsc reported type errors (exit=$BUILD_EXIT), but JS files were emitted"
            if [ ! -f dist/main.js ]; then
              echo "::error::dist/main.js not found after build"
              exit 1
            fi
          fi
          echo "Backend build OK"
          ls -la dist/main.js

      - name: 安装前端依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: 构建前端 (Nuxt -> .output)
        working-directory: frontend
        run: npm run build

      - name: 打包构建产物
        run: |
          rm -rf dist-artifacts
          mkdir -p dist-artifacts/backend-dist
          mkdir -p dist-artifacts/prisma
          cp -r backend/dist/* dist-artifacts/backend-dist/
          cp backend/package.json dist-artifacts/backend-package.json
          if [ -f backend/package-lock.json ]; then cp backend/package-lock.json dist-artifacts/backend-package-lock.json; fi
          cp -r backend/prisma/* dist-artifacts/prisma/
          cp -r frontend/.output dist-artifacts/frontend-output
          tar czf dist-artifacts.tar.gz dist-artifacts
          ls -lh dist-artifacts.tar.gz

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist-artifacts.tar.gz
          retention-days: 1

  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts

      - name: 配置 SSH 密钥
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 添加服务器到 known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p ${{ secrets.SSH_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 上传构建包到服务器
        run: |
          scp -P ${{ secrets.SSH_PORT }} dist-artifacts.tar.gz \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/panda-note-dist.tar.gz
          echo "Upload OK"

      - name: 远程部署（解压、安装依赖、迁移数据库、重启服务）
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            TAR_FILE="/tmp/panda-note-dist.tar.gz"

            echo "=========================================="
            echo " 熊猫笔记 自动部署"
            echo " 时间: $(date)"
            echo "=========================================="

            echo ""
            echo ">>> [1/5] 准备部署目录..."
            mkdir -p "$DEPLOY_DIR/backend/dist" "$DEPLOY_DIR/backend/prisma" "$DEPLOY_DIR/frontend/.output"

            echo ""
            echo ">>> [2/5] 解压构建产物..."
            cd /tmp
            rm -rf dist-artifacts
            tar xzf "$TAR_FILE"
            rm -f "$TAR_FILE"

            echo "  - 同步后端 dist..."
            rm -rf "$DEPLOY_DIR/backend/dist"/*
            cp -rf /tmp/dist-artifacts/backend-dist/* "$DEPLOY_DIR/backend/dist/"
            cp -f /tmp/dist-artifacts/backend-package.json "$DEPLOY_DIR/backend/package.json"
            if [ -f /tmp/dist-artifacts/backend-package-lock.json ]; then
              cp -f /tmp/dist-artifacts/backend-package-lock.json "$DEPLOY_DIR/backend/package-lock.json"
            fi
            echo "  - 同步 prisma..."
            rm -rf "$DEPLOY_DIR/backend/prisma"/*
            cp -rf /tmp/dist-artifacts/prisma/* "$DEPLOY_DIR/backend/prisma/"
            echo "  - 同步前端 .output..."
            rm -rf "$DEPLOY_DIR/frontend/.output"/*
            cp -rf /tmp/dist-artifacts/frontend-output/* "$DEPLOY_DIR/frontend/.output/"

            rm -rf /tmp/dist-artifacts

            echo ""
            echo ">>> [3/5] 后端安装生产依赖..."
            cd "$DEPLOY_DIR/backend"
            npm install --omit=dev --no-audit --no-fund --legacy-peer-deps

            echo ""
            echo ">>> [4/5] 同步数据库 schema..."
            npx prisma db push --skip-generate --accept-data-loss

            echo ""
            echo ">>> [5/5] 重启服务 (PM2)..."
            pm2 reload nav-log-backend 2>/dev/null || \
              pm2 start dist/main.js --name nav-log-backend --node-args="--max-old-space-size=512"

            cd "$DEPLOY_DIR/frontend"
            pm2 reload nav-log-frontend 2>/dev/null || \
              pm2 start .output/server/index.mjs --name nav-log-frontend --node-args="--max-old-space-size=512"

            pm2 save

            echo ""
            echo "=========================================="
            echo " 部署命令执行完毕！等待健康检查..."
            echo "=========================================="

      - name: 健康检查
        run: |
          echo "等待服务启动 (15s)..."
          sleep 15

          echo ""
          echo ">>> 后端健康检查 (http://${{ secrets.DEPLOY_HOST }}:3002/api/ops/health)..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 5 --max-time 10 \
            http://${{ secrets.DEPLOY_HOST }}:3002/api/ops/health || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Backend OK! HTTP $HTTP_CODE"
          else
            echo "Backend HTTP $HTTP_CODE, retrying in 8s..."
            sleep 8
            HTTP_CODE2=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 --max-time 10 \
              http://${{ secrets.DEPLOY_HOST }}:3002/api/ops/health || echo "000")
            echo "Backend retry: HTTP $HTTP_CODE2"
          fi

          echo ""
          echo "=========================================="
          echo " Deployment complete!"
          echo " URL: http://${{ secrets.DEPLOY_HOST }}"
          echo "=========================================="
